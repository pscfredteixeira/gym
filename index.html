      html,body{margin:0;min-height:100%;background:#0c0e10;color:#f8f8f7;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
      #gym-boot{min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px}
      #gym-boot strong{font-size:34px;letter-spacing:-2px}
      #gym-boot strong span{color:#ff712c}
      #gym-boot p{font-size:14px;line-height:1.6;color:#b5b5b8}
      #gym-boot a{color:#ffad81}
      #gym-boot-error{display:none;max-width:330px}
      body.gym-boot-failed #gym-boot-wait{display:none}
      body.gym-boot-failed #gym-boot-error{display:block}
    </style>
    <script>
      (function () {
        function showError() {
          if (document.getElementById("gym-boot")) {
            document.body.classList.add("gym-boot-failed");
          }
        }
        window.addEventListener("error", showError);
        window.addEventListener("unhandledrejection", showError);
        window.setTimeout(showError, 12000);
      })();
    </script>
