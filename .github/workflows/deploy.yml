name: Build and publish GYM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate backup schema
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Validate iPhone home screen app icons and manifest
        run: npm run test:pwa
      # GitHub Pages may still be configured as "Deploy from a branch",
      # while an Actions-based deployment is also enabled. The branch
      # build otherwise serves index.html with an uncompiled .tsx script:
      # a blank screen on iPhone. Publish the compiled site to BOTH paths
      # so either Pages source produces a functioning application.
      - name: Keep branch-based Pages publication functional
        run: |
          cp dist/index.html index.html
          rm -rf assets
          cp -R dist/assets assets
          cp dist/favicon.svg favicon.svg
          cp dist/manifest.webmanifest manifest.webmanifest
          cp dist/apple-touch-icon.png apple-touch-icon.png
          cp dist/apple-touch-icon-v2.png apple-touch-icon-v2.png
          cp dist/apple-touch-icon-v3.png apple-touch-icon-v3.png
          rm -rf icons
          cp -R dist/icons icons
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets favicon.svg manifest.webmanifest apple-touch-icon.png apple-touch-icon-v2.png apple-touch-icon-v3.png icons .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "build: sync compiled GYM site [skip ci]"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload compiled app
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar o endereço público e assets compilados
        run: node scripts/check-deploy.mjs

      - name: Testar renderização no navegador
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "::error::Não foi encontrado navegador para testar a página"
            exit 1
          fi
          echo "Browser: $BROWSER"
          timeout 55 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom "https://pscfredteixeira.github.io/gym/?browser_check=${GITHUB_SHA}" > /tmp/gym-dom.html 2> /tmp/gym-browser.log || {
            tail -n 40 /tmp/gym-browser.log
            exit 1
          }
          if ! grep -q "Vamos treinar" /tmp/gym-dom.html; then
            echo "::error::A interface React não apareceu no DOM após executar o JavaScript"
            head -c 1800 /tmp/gym-dom.html || true
            echo
            tail -n 60 /tmp/gym-browser.log || true
            exit 1
          fi
          echo "PASSOU: tela inicial do React renderizada em um navegador real"

      - name: Testar biblioteca real no navegador
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "::error::Navegador não encontrado"
            exit 1
          fi
          timeout 65 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom "https://pscfredteixeira.github.io/gym/?tab=library&browser_check=${GITHUB_SHA}" > /tmp/gym-atlas.html 2> /tmp/gym-atlas.log || {
            tail -n 40 /tmp/gym-atlas.log; exit 1
          }
          if ! grep -q "Conheça cada" /tmp/gym-atlas.html || ! grep -q "Buscar exercícios" /tmp/gym-atlas.html; then
            echo "::error::A tela da biblioteca não renderizou a busca e o conteúdo principal"
            head -c 2500 /tmp/gym-atlas.html || true
            tail -n 55 /tmp/gym-atlas.log || true
            exit 1
          fi
          echo "PASSOU: tela da biblioteca renderizada no GitHub Pages; catálogo persistido é coberto pelos testes IndexedDB"

      - name: Testar registro real de cardio no navegador
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "::error::Navegador não encontrado"
            exit 1
          fi
          timeout 65 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom "https://pscfredteixeira.github.io/gym/?tab=cardio&browser_check=${GITHUB_SHA}" > /tmp/gym-cardio.html 2> /tmp/gym-cardio.log || {
            tail -n 40 /tmp/gym-cardio.log; exit 1
          }
          if ! grep -q "Seu ritmo" /tmp/gym-cardio.html || ! grep -q "Registrar atividade" /tmp/gym-cardio.html; then
            echo "::error::A tela de cardio não renderizou o formulário real"
            head -c 2200 /tmp/gym-cardio.html || true
            tail -n 40 /tmp/gym-cardio.log || true
            exit 1
          fi
          echo "PASSOU: tela de cardio e formulário real renderizados no GitHub Pages"

      - name: Testar evolução real no navegador
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "::error::Navegador não encontrado"
            exit 1
          fi
          timeout 65 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom "https://pscfredteixeira.github.io/gym/?tab=progress&browser_check=${GITHUB_SHA}" > /tmp/gym-progress.html 2> /tmp/gym-progress.log || {
            tail -n 40 /tmp/gym-progress.log; exit 1
          }
          if ! grep -q "SEU HISTÓRICO. SEM SIMULAÇÕES." /tmp/gym-progress.html || ! grep -q "Progressão de carga" /tmp/gym-progress.html; then
            echo "::error::A tela de evolução real não renderizou"
            head -c 2000 /tmp/gym-progress.html || true
            tail -n 50 /tmp/gym-progress.log || true
            exit 1
          fi
          if grep -q "GRÁFICOS ILUSTRATIVOS — NÃO SÃO SEUS RESULTADOS" /tmp/gym-progress.html; then
            echo "::error::Gráficos fictícios foram renderizados na aba Evolução"
            exit 1
          fi
          echo "PASSOU: evolução real renderizada no GitHub Pages sem gráficos fictícios"
